name: OpenCode runner CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/cloudflare/opencode-runner/**"
      - "lib/ai-runtime/**"
      - "lib/ai-entry/runtime/**"
      - "app/api/ai/chat/route.ts"
      - "app/api/platform/artifacts/**"
      - "tsconfig.opencode-runner.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/opencode-runner/**"
      - "lib/ai-runtime/**"
      - "lib/ai-entry/runtime/**"
      - "app/api/ai/chat/route.ts"
      - "app/api/platform/artifacts/**"
      - "tsconfig.opencode-runner.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify app runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit --pretty false -p tsconfig.opencode-runner.json
          pnpm exec eslint app/api/ai/chat/route.ts lib/ai-runtime lib/ai-entry/runtime lib/ai-entry/conversation-state.ts lib/ai-entry/repository.ts --max-warnings=0
          pnpm exec tsx --test lib/ai-runtime/opencode-protocol.test.ts lib/ai-entry/runtime/*.test.ts app/api/ai/chat/route.test.ts
      - name: Verify Cloudflare runner
        working-directory: infra/cloudflare/opencode-runner
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run deploy:dry-run
