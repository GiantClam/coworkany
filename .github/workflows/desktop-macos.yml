name: Desktop macOS Validation

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "content/**"
      - "package.json"
      - "scripts/desktop-release*.mjs"
      - "scripts/release-macos*"
      - "scripts/macos-release.entitlements.plist"
      - "scripts/prepare-macos-release-runtime*"
      - "scripts/generate-macos-icon.mjs"
      - "scripts/package-macos-portable.mjs"
      - "scripts/stage-macos-desktop-runtime.mjs"
      - ".github/workflows/desktop-macos.yml"
      - ".github/workflows/desktop-release.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate desktop TypeScript and platform tests
        run: |
          pnpm desktop:typecheck
          pnpm desktop:test

      - name: Validate macOS Rust target
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[],"icon":["icons/coworkany-icon.png"]}}'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Parse macOS release scripts
        run: |
          node --check scripts/generate-macos-icon.mjs
          node --check scripts/stage-macos-desktop-runtime.mjs
          node --check scripts/package-macos-portable.mjs
          bash -n scripts/release-macos.sh
          node --test scripts/desktop-release.test.mjs scripts/release-macos.test.mjs
          python3 scripts/prepare-macos-release-runtime.test.py
